# Redstart Nest — the front door's relay, VPS side.
#
# A pipe and nothing else. It accepts TCP on 443 and passes the bytes down the
# WireGuard tunnel to Caddy at home, still encrypted. There is no certificate,
# no key and no `ssl` keyword anywhere in this file, and the test suite fails if
# one appears: the moment the VPS terminates TLS, whoever controls the VPS can
# read everything, which is the exact property this design exists to avoid.
#
# UNVERIFIED. Written from HAProxy's documentation; nobody has run it.
#
# Placeholder: 10.66.0.2 is the home machine's tunnel address
# (wireguard/wg-home.conf). scripts/test-deploy-configs.mjs checks they agree.

global
	log stdout format raw local0
	maxconn 2000

defaults
	mode tcp
	log global
	option tcplog
	timeout connect 5s
	# Long, because a completion can sit silent while a large prompt is
	# processed, and the chat UI holds server-sent-event streams open. An idle
	# limit shorter than the slowest first token cuts replies off with no
	# error the user can read.
	timeout client 1h
	timeout server 1h

frontend https_in
	bind :443

	# A brake on floods before they reach your home connection: more than 50
	# new connections from one address in ten seconds is not a person. This
	# is the only layer that sees real client addresses before the tunnel.
	stick-table type ip size 100k expire 1m store conn_rate(10s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc_conn_rate(0) gt 50 }

	default_backend home

backend home
	# send-proxy-v2 prepends the real client address. Caddy at home accepts
	# it from this machine's tunnel address only (front-door/Caddyfile).
	server home 10.66.0.2:443 send-proxy-v2 check
