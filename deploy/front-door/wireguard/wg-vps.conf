# Redstart Nest — the front door's tunnel, VPS end.
#
# The VPS listens; home connects out to it. That direction is what makes this
# work behind CGNAT and with no port open on the home router.
#
# UNVERIFIED. Placeholders in angle brackets; never commit real keys.
# Generate a pair with:  wg genkey | tee private.key | wg pubkey > public.key

[Interface]
Address = 10.66.0.1/32
ListenPort = 51820
PrivateKey = <VPS_PRIVATE_KEY>

[Peer]
# Home. /32: the only address this tunnel will carry traffic for is the home
# machine's own tunnel address. Nothing else on the home network is routable
# from here, so a compromised VPS reaches Caddy and nothing behind it.
PublicKey = <HOME_PUBLIC_KEY>
AllowedIPs = 10.66.0.2/32
