# Redstart Nest — the front door's tunnel, home end.
#
# UNVERIFIED. Placeholders in angle brackets; never commit real keys.

[Interface]
Address = 10.66.0.2/32
PrivateKey = <HOME_PRIVATE_KEY>

[Peer]
# The VPS. AllowedIPs is the VPS's tunnel address ONLY — not 0.0.0.0/0. That
# would route all of this machine's traffic through the VPS, which is a VPN
# client, not a front door, and hands the VPS your browsing.
PublicKey = <VPS_PUBLIC_KEY>
Endpoint = <VPS_PUBLIC_IP>:51820
AllowedIPs = 10.66.0.1/32
# Home starts the tunnel and keeps it open. Without this, a NAT or CGNAT
# mapping expires while idle and the VPS has no way back in.
PersistentKeepalive = 25
