[package]
name = "redstart-twig-shell"
version = "0.1.0"
description = "Redstart Twig desktop shell: the window, the chat UI's origin, and twigd's lifetime"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# devtools: Electron Twig opened DevTools on F12 in a packaged build, and the
# shell keeps that (bridge.rs, `twig_devtools`).
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
