<!doctype html>
<!-- `dark` is hardcoded, not toggled: Redstart is dark-only. It stays on the
     element because the components' `dark:` utilities resolve against it. -->
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="favicon.ico" sizes="48x48" />
		<link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml" />

		<link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />

		<link rel="manifest" href="./manifest.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<!-- Paints the window before any CSS or JS loads, so it cannot use
		     var(--background) — it must be the literal equivalent of app.css's
		     `--background: oklch(0.12 0 0)`. Keep the two in step: when this said
		     #09090b the window opened a lighter shade and stepped darker on the
		     first paint. -->
		<style>html { background: #060606; }</style>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
