name: Caddy build

# Builds the Caddy that Nest bundles as its TLS front door (TLS plan C1):
# upstream Caddy plus three DNS-01 plugins, for every platform Nest ships on,
# published as a release on this repo that release.yml and fetch-caddy.mjs
# download by tag and sha256 (the same pattern as the TurboQuant+ pin).
#
# When it runs: by hand (Actions → Caddy build → Run workflow), and on any
# push that changes this file, so a version bump builds as part of its own
# change. It does not run on every pull request: nothing else changes what
# it builds.
#
# What it never does: replace a published build. The tag names the build
# (caddy-redstart-<caddy version>-<BUILD>), and if that tag already exists
# the publish job stops. A pinned sha256 elsewhere in the repo must keep
# naming the bytes it was copied from. To rebuild the same Caddy version
# (a Go or plugin bump), raise BUILD.
#
# The tag is deliberately not a semver version. shared/update-feed.mjs
# skips any release whose tag it cannot parse, so neither app's updater
# ever mistakes this release for an app update (scripts/test-caddy-build.mjs
# asserts that). It is also marked prerelease and never "latest".
#
# To bump: change the versions below and BUILD, push, then copy the new tag
# and the three sha256 values from the release's SHA256SUMS into
# redstart-nest/scripts/fetch-caddy.mjs, in one commit.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/caddy.yml
      - infra/caddy-dns-*/**

permissions:
  contents: read

env:
  # Every input is an exact version. Caddy's own releases are built with Go
  # 1.27; Caddy 2.11 needs at least 1.26.
  GO_VERSION: 1.27.4
  XCADDY_VERSION: v0.4.7
  CADDY_VERSION: v2.11.9
  # Third-party plugins (each one is code inside the binary that holds the
  # DNS token). A plugin bump is its own change, and the .json beside each
  # asset records what went in. Both are on libdns v1, which Caddy 2.10+
  # requires.
  PLUGIN_DESEC: github.com/caddy-dns/desec@v1.1.0
  PLUGIN_ACMEDNS: github.com/caddy-dns/acmedns@v0.7.0
  # Redstart's own module, built from this checkout. It replaced the
  # community caddy-dns/duckdns plugin in BUILD 2: that plugin publishes no
  # license, so it cannot be redistributed. It wraps libdns/duckdns (MIT),
  # pinned by its go.mod / go.sum.
  LOCAL_DUCKDNS: github.com/ImDeadWeight/redstart-project/infra/caddy-dns-duckdns=./infra/caddy-dns-duckdns
  BUILD: 2

jobs:
  build:
    name: Build Caddy (windows-amd64, darwin-arm64, linux-amd64)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No module cache: every build starts from the module proxy and its
          # checksum database, never from a cache another run could have written.
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Name the build
        id: name
        run: echo "tag=caddy-redstart-${CADDY_VERSION}-${BUILD}" >> "$GITHUB_OUTPUT"

      # Redstart's own Caddy modules: verified, vetted and tested before they
      # are built in.
      - name: Test infra/caddy-dns-duckdns
        working-directory: infra/caddy-dns-duckdns
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Install xcaddy (pinned)
        run: go install "github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}"

      # Pure Go, cross-compiled from one runner. CGO_ENABLED=0 so nothing links
      # against the runner's C libraries; -trimpath so no runner path is baked in.
      - name: Build
        env:
          CGO_ENABLED: '0'
          XCADDY_GO_BUILD_FLAGS: "-trimpath -ldflags '-w -s'"
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          for target in windows/amd64 darwin/arm64 linux/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" xcaddy build "$CADDY_VERSION" \
              --with "$LOCAL_DUCKDNS" \
              --with "$PLUGIN_DESEC" \
              --with "$PLUGIN_ACMEDNS" \
              --output "out/${TAG}-${os}-${arch}${ext}"
          done

      # The Linux build runs here, so it is the one smoke-tested. The other two
      # are the same source for another GOOS/GOARCH; provenance below reads
      # their embedded build info to prove they contain the same modules.
      - name: Smoke (linux-amd64)
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          bin="out/${TAG}-linux-amd64"
          "$bin" version
          modules="$("$bin" list-modules)"
          for m in dns.providers.duckdns dns.providers.desec dns.providers.acmedns http.handlers.reverse_proxy; do
            grep -qx "$m" <<<"$modules" || { echo "::error::$m missing from the build"; exit 1; }
          done

      # Provenance, then the license notices of every module in each binary.
      # caddy-notices.mjs FAILS on a module with no license file, which is
      # how BUILD 1's unlicensed plugin should have been caught.
      - name: Provenance and notices
        run: |
          set -euo pipefail
          bins=$(ls out/*)
          node redstart-nest/scripts/caddy-provenance.mjs --xcaddy "$XCADDY_VERSION" $bins
          node redstart-nest/scripts/caddy-notices.mjs --modcache "$(go env GOMODCACHE)" \
            --repo-root . --commit "$GITHUB_SHA" out/*.json
          (cd out && sha256sum $(ls | grep -v '\.json$') > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: caddy
          path: out/
          if-no-files-found: error

  publish:
    name: Publish the release (never replaces one)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: caddy
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published; a published build is never replaced. Raise BUILD to publish a new one."
            exit 0
          fi
          {
            echo "Caddy ${CADDY_VERSION} with ${PLUGIN_DESEC}, ${PLUGIN_ACMEDNS} and Redstart's own infra/caddy-dns-duckdns (over libdns/duckdns)."
            echo "Built with Go ${GO_VERSION} and xcaddy ${XCADDY_VERSION} by .github/workflows/caddy.yml."
            echo
            echo "Not a Redstart release: this is the TLS front door Nest bundles."
            echo "Each binary's .json is its build provenance (go version -m); its .NOTICES.txt holds the license files of every module inside it."
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md --prerelease --latest=false out/*
