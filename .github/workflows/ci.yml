name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security tests + checks
    runs-on: ubuntu-latest
    env:
      # The security tests stub Electron (scripts/electron-stub.mjs via
      # auth-test-loader.mjs), so the real ~100 MB Electron binary is never
      # needed — skip the download to keep installs fast and non-flaky.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: redstart-nest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 26: the Node the desktop shell bundles and runs nestd on
          # (scripts/stage-node.mjs), so the suites run where the daemon does.
          # chat-ui's @capacitor/cli needs >= 22 under engine-strict anyway.
          node-version: 26
          cache: npm
          cache-dependency-path: |
            redstart-nest/package-lock.json
            redstart-nest/src/chat-ui/package-lock.json

      - name: Install launcher / main-process deps
        run: npm ci

      - name: Install chat-ui deps
        run: npm ci
        working-directory: redstart-nest/src/chat-ui

      - name: Typecheck launcher (tsc --noEmit)
        run: npm run typecheck

      - name: Syntax-check daemon (node --check)
        run: npm run check:mjs

      # Security suites run as separate steps so a failure is identifiable from
      # the step name via the API alone (no log access needed). This list must
      # stay in sync with the `test:security` script in package.json — a suite
      # that exists locally but not here is a suite that does not gate merges.
      # Postgres and live-web cases self-skip when no DB / network resource is
      # present. Full svelte-check is intentionally NOT run — it reports
      # pre-existing test-file type errors unrelated to these guarantees.
      - name: "Security: CI parity (this list vs test:security)"
        run: node scripts/test-ci-parity.mjs

      - name: "Security: path containment (path-scope)"
        run: node scripts/test-path-scope.mjs

      - name: "Security: conversation isolation"
        run: node scripts/test-conversation-isolation.mjs

      - name: "Security: per-account file isolation"
        run: node scripts/test-file-isolation.mjs

      - name: "Security: tool policy classification"
        run: node scripts/test-tool-policy.mjs

      - name: "Security: role narrowing (restrict-only law)"
        run: node scripts/test-roles.mjs

      - name: "Security: tool namespacing (ban targetability)"
        run: node scripts/test-tool-namespacing.mjs

      - name: "Security: tool retrieval (subset-only selection)"
        run: node scripts/test-tool-retrieval.mjs

      - name: "Security: per-account storage scope (path traversal)"
        run: node scripts/test-user-scope.mjs

      - name: "Security: system prompt capability + privacy claims"
        run: node scripts/test-system-prompt.mjs

      - name: "Security: llama-server localhost-only args"
        run: node scripts/test-llama-args.mjs

      # binaryPathRejection() guards spawn()'s first argument and had no
      # coverage at all before 8A.3 made it per-platform. The POSIX branch's
      # positive cases only run for real here — chmod is inert on win32.
      - name: "Security: server binary name + path validation"
        run: node scripts/test-server-binary.mjs

      - name: "Security: model downloads (host allowlist, containment, checksums)"
        run: node scripts/test-model-download.mjs

      - name: "Security: LAN exposure is a socket bind, not a firewall rule"
        run: node scripts/test-network-binding.mjs

      - name: "Security: web_fetch SSRF guard (literal + DNS resolution)"
        run: node scripts/test-web-fetch-ssrf.mjs

      - name: "Security: open web search is off unless chosen (schema, call, role, prompt)"
        run: node scripts/test-web-search-engine.mjs

      # Downloads the pinned Pyodide (~30 MB, every hash checked) on a cold
      # cache, then runs every Phase 1.0 escape against the real sandbox. Must
      # pass on every Pyodide bump. Linux is where a symlink can be created
      # unprivileged, so this job is the one that proves the link refusal.
      - name: Cache the pinned Pyodide runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pyodide
          key: pyodide-314.0.7

      - name: "Security: run_python sandbox (no network, no escape from the workspace)"
        run: node scripts/test-python-sandbox.mjs
        env:
          REDSTART_PYODIDE_DIR: ${{ runner.temp }}/pyodide

      - name: "Security: conversation workspaces (layout, ownership, caps, trash)"
        run: node scripts/test-conversation-workspace.mjs

      - name: "Output: tool results carry files as resource links, not bytes"
        run: node scripts/test-tool-result-links.mjs

      - name: "Security: memory is per account, bounded, framed as data, web saves marked"
        run: node scripts/test-memory.mjs

      - name: "Security: document search is per account; index, citations, sync"
        run: node scripts/test-document-search.mjs

      - name: "Security: external MCP endpoint validation"
        run: node scripts/test-external-mcp-url.mjs

      - name: "Durability: atomic JSON state writes"
        run: node scripts/test-json-store.mjs

      - name: "Security: secrets provider seam + legacy ciphertext"
        run: node scripts/test-secrets.mjs

      - name: "Security: OSCrypt provider reads what Electron safeStorage wrote"
        run: node scripts/test-secrets-dpapi.mjs

      - name: "Security: the shell pins the secrets key and DPAPI-wraps it"
        run: node scripts/test-shell-secrets-key.mjs

      # Trap 5.3 — the one step in the headless-admin-plane pass that can
      # destroy stored credentials silently. Nearly every case here asserts a
      # FAILURE path: what survives when a secret cannot be read, what is left
      # behind when the write fails, what happens to a populated target.
      - name: "Security: secrets re-key migration (trap 5.3)"
        run: node scripts/test-secrets-migration.mjs

      - name: "Process supervision: reap by PID, never by name"
        run: node scripts/test-process-supervision.mjs

      # The daemon's own pid file — what `npm run daemon:stop` signals. Every
      # interesting case is one where the file is lying: stale after a hard
      # kill, or a pid that has been recycled by an unrelated process.
      - name: "Supervision: daemon pid file (stale + pid reuse)"
        run: node scripts/test-daemon-pidfile.mjs

      # Which release the auto-updater moves an install to. A wrong answer is
      # a downgrade, a stable install pulled onto an alpha, or a release with
      # no Nest manifest. Also pins the manifest names the release writes and
      # the Tauri shell asks for, and that an update installs only on a
      # deliberate quit.
      - name: "Updates: release selection (no downgrades)"
        run: node scripts/test-update-feed.mjs

      - name: "Security: MCP plugin registry validation"
        run: node scripts/test-plugin-registry.mjs

      - name: "Security: per-plugin stdio MCP client (timeout, crash, env isolation)"
        run: node scripts/test-plugin-client.mjs

      - name: "Security: npm/uv runtime detection (both real path layouts)"
        run: node scripts/test-plugin-runtimes.mjs

      - name: "Security: plugin install pipeline (--ignore-scripts, probe, uninstall)"
        run: node scripts/test-plugin-install.mjs

      - name: "Security: MCP registry client (compatibility verdicts, fixture-driven)"
        run: node scripts/test-plugin-registry-api.mjs

      - name: "Security: plugin provider adapter (dual-switch activation, namespacing, health)"
        run: node scripts/test-plugin-provider.mjs

      - name: "Security: log redaction contract (blocklist + audit allowlist)"
        run: node scripts/test-logging.mjs

      - name: "Security: discovery robustness (beacon)"
        run: node scripts/test-discovery-robustness.mjs

      - name: "Security: LAN interface selection (mDNS / advertised IP)"
        run: node scripts/test-net-interfaces.mjs

      - name: "Packaging: escaping imports + asar-unpacked assets"
        run: node scripts/test-packaging.mjs

      - name: "Packaging: Tauri release assets + both update manifests (the bridge)"
        run: node scripts/test-shell-manifests.mjs

      - name: "Security: auth / sessions / roles"
        run: node scripts/test-auth.mjs

      - name: "Security: session persistence / plane binding"
        run: node scripts/test-sessions.mjs

      - name: "Security: gateway routes / request rewriting"
        run: node scripts/test-gateway-routes.mjs

      - name: "Security: control plane (admin listener authz + static allowlist)"
        run: node scripts/test-admin-listener.mjs

      - name: "Security: bootstrap token / control-plane login"
        run: node scripts/test-admin-bootstrap.mjs

      - name: "Security: control-plane API coverage + gating"
        run: node scripts/test-admin-api.mjs

      - name: "Security: server-side directory browser (Phase 4)"
        run: node scripts/test-browse-routes.mjs

      - name: "Security: shared event broker (Phase 5)"
        run: node scripts/test-event-broker.mjs

      - name: "Security: llama-server process log (Phase 5)"
        run: node scripts/test-process-log.mjs

      - name: "Security: control-plane live feed / SSE (Phase 5)"
        run: node scripts/test-admin-events.mjs

      - name: "Security: MCP capability gating"
        run: node scripts/test-mcp-capabilities.mjs

      - name: "Security: provider conformance"
        run: node scripts/test-provider-conformance.mjs

      - name: "Security: boundary response contracts"
        run: node scripts/test-contracts.mjs

      - name: "Security: connector contract conformance"
        run: node scripts/test-connector-contract.mjs

      # The only suite that runs the actual daemon rather than importing its
      # modules — and the only place the headless entrypoint is exercised at
      # all. Linux, no display, no Electron, which is exactly the platform
      # Phase 8A exists for.
      - name: "Daemon: nestd boots, serves, and stops (smoke)"
        run: node scripts/test-daemon-smoke.mjs

      - name: "Daemon: nestd under a shell (pipe protocol, shell's key, EOF stops it)"
        run: node scripts/test-shell-pipe.mjs

      - name: "Security: containment / SSRF / beacon / download endpoint (vitest)"
        run: npm --prefix src/chat-ui run test:security

      # The security-focused vitest step above runs only security.test.ts. The
      # rest of the unit project guards behavior that has silently regressed
      # before — document table rendering, the tool-call fallback parser — so it
      # runs here too rather than only on developer machines.
      - name: "Unit tests (vitest)"
        run: npm --prefix src/chat-ui run test:unit -- --run

      # Real-browser mount coverage. The node suites prove the HTTP layer and
      # svelte-check proves the types, but neither catches a component that
      # throws on mount or binds to a prop the UI library does not expose —
      # which is exactly how the settings tabs and the mode picker shipped
      # (built, type-checked, never rendered). This is the step that stops
      # that happening again.
      # svelte-check has no "fail above N" mode and the repo is not at zero yet,
      # so the count is pinned by a guard script. The previous baseline reached
      # 513 because nothing ran this at all.
      - name: "Types: svelte-check baseline"
        run: npm --prefix src/chat-ui run check:baseline

      # npm ci installs the playwright package but not its browser binaries,
      # and the client project drives a real Chromium.
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
        working-directory: redstart-nest/src/chat-ui

      - name: "Client render tests (vitest browser)"
        run: npm --prefix src/chat-ui run test:client -- --run

  shell:
    # The Tauri desktop shell (daemon split T2/T3). The Windows unit tests
    # include a real DPAPI round trip for the runner's account.
    name: Desktop shell (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15: the only place the macOS half (Keychain, LaunchAgent,
        # traffic-light window) is compiled and unit-tested at all.
        os: [windows-latest, macos-15]
    defaults:
      run:
        working-directory: redstart-nest/shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            redstart-nest/shell/target
          key: shell-${{ runner.os }}-${{ hashFiles('redstart-nest/shell/Cargo.lock') }}

      # tauri::generate_context!() embeds the app icons at compile time, and
      # build/ is generated (gitignored), as `npm run build` does first.
      - name: Generate the app icons
        run: node ../scripts/make-icon.mjs

      - name: Build
        run: cargo build --locked

      - name: Unit tests (pipe framing, secrets key incl. real DPAPI, origin check)
        run: cargo test --locked

  twig:
    # twigd, Twig's Node half: the folder tools' containment and recoverable
    # delete, and the pipe contract the Tauri shell relies on (driven over
    # stdio against the real twigd, including the shell's method allowlist).
    # No dependencies to install: twigd imports only this repo.
    name: Twig (twigd + local file tools)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows: the platform twigd ships on most, and where the MCP
        # children are cmd.exe trees. Ubuntu: symlink containment cases.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: redstart-twig/windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # npm test is the suite list (package.json), so CI and a local run
      # cannot drift: test-fs-tool (containment, recoverable delete), then
      # test-twigd (the shell pipe contract). No install: no dependencies run.
      - name: Twig suites (npm test)
        run: npm test

  twig-shell:
    # Twig's Tauri shell: the chat UI's protocol (containment, the 503 rule,
    # CSP), the page's allowlist, the origin pin, the pid wait on real children.
    name: Twig desktop shell (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15: the only place Twig's macOS half is compiled at all.
        os: [windows-latest, macos-15]
    defaults:
      run:
        working-directory: redstart-twig/windows/shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            redstart-twig/windows/shell/target
          key: twig-shell-${{ runner.os }}-${{ hashFiles('redstart-twig/windows/shell/Cargo.lock') }}

      # generate_context!() embeds the icons, which Nest's make-icon generates.
      - name: Generate the app icons
        run: node ../../../redstart-nest/scripts/make-icon.mjs

      - name: Build
        run: cargo build --locked

      - name: Unit tests (protocol containment, allowlist, origin, pid wait)
        run: cargo test --locked
